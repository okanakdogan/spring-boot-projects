services:
  eureka-server:
    build: ./eureka
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - eureka-network
    restart: unless-stopped

  service-1:
    build: ./service_1
    container_name: service-1
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - eureka-network
    depends_on:
      - eureka-server
      - zipkin
    restart: unless-stopped

  service-2:
    build: ./service_2
    container_name: service-2
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - eureka-network
    depends_on:
      - eureka-server
      - zipkin
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - eureka-network
    restart: unless-stopped

networks:
  eureka-network:
    driver: bridge
