spring.application.name=service-1

# Server Configuration
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Eureka Client Retry Configuration
eureka.client.retry.initial-interval-ms=2000
eureka.client.retry.max-interval-ms=15000
eureka.client.retry.max-attempts=5
eureka.client.retry.multiplier=1.5

# Eureka Client Connection Timeout
eureka.client.service-url.connection-timeout=10000
eureka.client.service-url.read-timeout=10000

# Management endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenTelemetry tracing configuration
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# Zipkin exporter configuration
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Service name for tracing
management.observations.key-values.service.name=service-1


